# Source of truth for projects/README.md (by topic) and projects/BY_YEAR.md (by year).
# Edit this file, then run:  python generate_readme.py
#
# Each project:
#   name:   display name
#   date:   "YYYY-MM" (first public release). Controls ordering in both views and the year grouping.
#   links:  label: url   (rendered as [[label]](url), in the order given; relative paths are fine)
#   blurb:  one-line description (rendered in italics)
#   topics: one or more "Section" or "Section / subsection" entries, matching `sections` below.
#           A project listed under several topics appears in each of them in the topic view,
#           but only once in the year view.
#
# Within a month, projects appear in the order listed here, so add new projects at the top.

title: "RAM Projects"
intro: >-
  Here we list projects undertaken in the RAM framework that are shared publicly, either in the
  form of papers, public tasks and/or shared model code. This directory also contains subfolders
  for some of the projects which are housed in the RAM repo, others are maintained via external websites.

# Order of sections and subsections in the topic view.
# Autoresearch and Agents are pinned first; the rest are ordered most-recent-first
# by the average date of each section's 5 newest projects (as of Nov 2026),
# except Synthetic Data (placed by hand after (Self-)Alignment) and
# Memory & Architectures (placed by hand last).
sections:
  - title: "Autoresearch & Co-Improvement"
  - title: "Agents"
  - title: "Reward Models & Evaluation"
  - title: "(Self-)Alignment"
    subsections:
      - "(self-)alignment optimization techniques"
      - "(self-)alignment via other methods"
      - "data curation"
  - title: "Synthetic Data"
    subsections:
      - "synthetic data & data quality"
      - "synthetic data for complex reasoning & tools"
  - title: "Pre- and Mid-Training"
  - title: "Reasoning"
    subsections:
      - "CoT and RL"
      - "other algorithms"
      - "inference"
  - title: "Memory & Architectures"
    subsections:
      - "memory"
      - "architectures"

